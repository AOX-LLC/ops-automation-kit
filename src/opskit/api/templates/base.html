<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Approvals{% endblock %} · ops-automation-kit</title>
  <link rel="stylesheet" href="/static/approver.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Approvals</span>
    {% if logged_in %}
    <form method="post" action="/approver/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
