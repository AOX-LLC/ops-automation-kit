{# Status is colour, an icon and a word; pending also has a dashed edge. #}
{% macro status_badge(status) -%}
<span class="badge badge-{{ status }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if status == "pending" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
  {%- elif status in ("approved", "consumed") -%}<path d="M5 12l5 5L20 7"/>
  {%- else -%}<path d="M6 6l12 12M18 6L6 18"/>
  {%- endif -%}</svg>
  {{ status | capitalize }}</span>
{%- endmacro %}
