# Default rules, plus two narrow exceptions for the generic-api-key rule only.
[extend]
useDefault = true

# Phase 1's hand-written fixture (deleted in Phase 2, still in git history) carried a
# SHA-256 content hash in "fixture_key", not a credential. History scans need this.
[[allowlists]]
description = "fixture_key content hashes in the Phase 1 fixture, kept for history scans"
regexTarget = "line"
regexes = ['''^\s*"fixture_key": "[0-9a-f]{64}",?$''']
paths = ['''^fixtures/model/''']
condition = "AND"
targetRules = ["generic-api-key"]

[[allowlists]]
description = "internal helper API URLs in n8n workflow exports (host:port/path, no credentials)"
regexTarget = "line"
regexes = ['''^\s*"url": "=?http://api:8000/[A-Za-z0-9/_{}()$'. -]*",?$''']
paths = ['''^n8n/workflows/''']
condition = "AND"
targetRules = ["generic-api-key"]
