[project]
name = "opskit"
version = "0.1.0"
description = "Helper API for three n8n + Claude small-business workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34",
]

[dependency-groups]
samples = [
    "pillow==12.3.0",
    "pyyaml>=6.0.2",
]
dev = [
    { include-group = "samples" },
    "import-linter>=2.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opskit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tools/**" = ["S311"]  # sample generators need reproducible, not secure, randomness

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tools.*"]
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Postgres (and Mailpit) from the compose stack or CI services"]
