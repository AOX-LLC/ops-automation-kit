repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: public-safety
        name: public-safety denylist
        entry: python3 scripts/check_public_safety.py
        language: system
        pass_filenames: true
      - id: media-metadata
        name: media metadata (no free text, no denylisted term)
        entry: python3 scripts/check_media_metadata.py
        language: system
        files: (?i)\.(png|gif|mp4|webm|jpe?g|webp)$
        pass_filenames: true
