<!doctype html>
<html lang="en" data-theme="{{theme}}" data-layout="{{layout}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("{{fonts}}/space-grotesk/files/space-grotesk-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 600; src: url("{{fonts}}/space-grotesk/files/space-grotesk-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("{{fonts}}/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("{{fonts}}/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("{{fonts}}/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("{{fonts}}/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("{{fonts}}/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }

:root {
  --font-display: "Space Grotesk", "IBM Plex Sans", sans-serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
  --radius-sm: 2px;
  --radius-md: 4px;
}
:root[data-theme="dark"] {
  --bg: #0E1012; --surface: #15181B; --surface-muted: #1C2024; --border: #2A2F35;
  --text: #E6E8EA; --text-secondary: #C3C8CD; --text-muted: #9AA1A9;
  --accent: #3FC1B0; --on-accent: #08201D;
}
:root[data-theme="light"] {
  --bg: #F6F7F8; --surface: #FFFFFF; --surface-muted: #F0F2F4; --border: #DDE1E5;
  --text: #15181B; --text-secondary: #3D444B; --text-muted: #5B636B;
  --accent: #0F7A6F; --on-accent: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; }
html, body { width: {{width}}px; height: {{height}}px; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 400;
  display: grid; grid-template-rows: auto 1fr auto; padding: 56px 64px 48px;
}
.logo { height: 26px; width: auto; justify-self: start; }
main { display: flex; flex-direction: column; justify-content: center; gap: 24px; }
.eyebrow { font-family: var(--font-mono); font-weight: 500; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; }
.subtitle { font-size: 28px; line-height: 1.35; color: var(--text-secondary); max-width: 26em; }
.workflows { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.workflow { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 10px; }
.workflow + .workflow { border-left: 1px solid var(--border); }
.workflow-id { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
.workflow-name { font-weight: 600; font-size: 22px; }
.workflow-line { font-size: 17px; line-height: 1.45; color: var(--text-secondary); }
.command { font-family: var(--font-mono); font-weight: 500; font-size: 30px; padding: 22px 28px; background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-md); align-self: flex-start; }
.run-label { font-weight: 500; font-size: 26px; color: var(--text-secondary); }
.repo { font-family: var(--font-mono); font-size: 24px; color: var(--accent); }
footer { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
footer .repo-small { text-transform: none; letter-spacing: 0.02em; }

[data-layout="social"] body { padding: 44px 56px 40px; }
[data-layout="social"] h1 { font-size: 72px; }
[data-layout="social"] .subtitle { font-size: 26px; }
[data-layout="social"] .logo { height: 24px; }
.chips { display: flex; gap: 12px; margin-top: 8px; }
.chip { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }

[data-layout="title"] [data-show]:not([data-show~="title"]),
[data-layout="end"] [data-show]:not([data-show~="end"]),
[data-layout="social"] [data-show]:not([data-show~="social"]) { display: none; }
</style>
</head>
<body>
  <img class="logo" src="{{logo}}" alt="AOX">
  <main>
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="subtitle" data-show="title social">{{subtitle}}</p>
    <div class="workflows" data-show="title">{{workflowCells}}</div>
    <div class="chips" data-show="social">{{workflowChips}}</div>
    <p class="run-label" data-show="end">{{runLabel}}</p>
    <p class="command" data-show="end">{{runCommand}}</p>
    <p class="repo" data-show="end">{{repoUrl}}</p>
  </main>
  <footer>
    <span>{{sampleLabel}}</span>
    <span class="repo-small" data-show="title social">{{repoUrl}}</span>
  </footer>
</body>
</html>
