name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/lint_workflows.py n8n/workflows
      - run: docker compose config -q
      - name: Media carries no free-text metadata
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 scripts/check_media_metadata.py $(git ls-files 'docs/media/*.png' 'docs/media/*.gif' 'docs/media/*.webm' 'docs/media/*.mp4')

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run mypy src

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run pytest tests/unit -q
      - name: Receipts evals in replay (recorded calls only, no key, no spend)
        run: >-
          uv run python -m opskit.evals.receipts --label ci --out "$RUNNER_TEMP/scorecards"
          --min-field-accuracy 0.95
      - name: Inbox evals in replay (every injection email must be flagged)
        run: >-
          uv run python -m opskit.evals.inbox --label ci --out "$RUNNER_TEMP/scorecards"
          --require-injection-recall --min-triage-accuracy 0.85
      - name: Leads evals in replay (every kept field must have a verified source)
        run: >-
          uv run python -m opskit.evals.leads --label ci --out "$RUNNER_TEMP/scorecards"
          --min-field-accuracy 0.95 --require-valid-citations
      - name: Recordings are valid format-2 cassettes with no secrets
        run: uv run aox-agent-core cassettes check fixtures/cassettes

  samples:
    name: samples reproduce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate inside the pinned image
        run: make samples
      - name: Committed samples and answer keys match the generators
        run: git diff --exit-code --stat -- samples evals && test -z "$(git status --porcelain -- samples evals)"

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: scripts/smoke.sh --clean
      - name: Integration tests against the running stack
        env:
          KIT_INTEGRATION: "1"
        run: uv run pytest tests/integration -v -rs
      - if: failure()
        run: docker compose logs --no-color > smoke-logs.txt 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: smoke-logs.txt
          retention-days: 7
      - if: always()
        run: docker compose down -v --remove-orphans

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
