# Source of truth for the leads sample data. Everything here is fictional.
#
# Body paragraphs may use [[field]] (the doc's own company) or [[slug.field]] placeholders,
# which are replaced with the company's true values. `supports` lists the placeholder-backed
# "slug.field" facts a doc states; `claims` lists literal conflicting values a doc states.
# A paragraph whose lines all start with "* " renders as a list.

