# Hand-authored spec for the inbox sample data. Everything here is fictional.
business:
  name: Brightwater Home Services
  domain: brightwater-home.example
  owner: Marisol Quinn
  town: Larkspur Hollow
  phone: 555-0142
  emergency_phone: 555-0143
  summary: Plumbing, water heater and small-repair work for homes and small rental properties.
  hours:
    - "Monday to Friday: 8:00 am to 5:00 pm"
    - "Saturday: 9:00 am to 1:00 pm, booked appointments only"
    - "Sunday: closed"
    - "Emergency line 555-0143: answered 24 hours for active leaks and no-heat calls"
  service_area:
    - Larkspur Hollow
    - Marlow Ridge
    - East Pennick
    - Dunmore Flats
  service_area_note: We do not travel beyond 25 miles from Larkspur Hollow.
  prices:
    - item: Diagnostic visit
      price: "$89 flat fee, waived when we complete the repair"
    - item: Labor
      price: "$95 per hour"
    - item: Drain clearing
      price: "from $165"
    - item: 40-gallon tank water heater, installed
      price: "$1,450"
    - item: After-hours emergency surcharge
      price: "$75"
    - item: Annual maintenance plan
      price: "$199 per year"
  policies:
    - name: Cancellation
      text: "Free cancellation with 24 hours' notice. Later cancellations are charged a $45 fee."
    - name: Warranty
      text: "Labor is warranted for 12 months. Parts carry the manufacturer's warranty."
    - name: Estimates
      text: "Written estimates for installs are free. Jobs over $1,000 need a 20% deposit."
    - name: Payment
      text: "Invoices are due within 14 days. We accept card, check and bank transfer."
    - name: Refunds
      text: "Refund requests are reviewed by the owner. Staff do not promise refunds by email."
    - name: Vendor invoices and bank changes
      text: "The owner handles vendor invoices. Any change to payment details is confirmed by phone first."

messages:
  - slug: heater-quote
    from_name: Dana Whitlock
    from_addr: dana.whitlock@mailbox-one.example
    subject: Quote for a new water heater?
    date: "2026-08-03T08:12:00-04:00"
    language: en
    body: |-
      Hi,

      Our water heater is 14 years old and the pilot keeps going out. We're in East Pennick, three bedrooms, family of four. I'd like a quote to replace it with a standard 40 gallon tank. Can you tell me roughly what that costs and how soon someone could come look?

      Thanks,
      Dana
    labels:
      category: sales_inquiry
      priority: normal
      needs_reply: true
      escalate: false
      reply_must_include:
        - "40-gallon tank water heater, installed: $1,450"
        - "Written estimates for installs are free"
